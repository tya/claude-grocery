# Two years of purchase history, the recipe library, the cart ledger and the
# Kroger refresh token all live here. This is the only thing in the stack that
# cannot be rebuilt, so it wants real local disk — SQLite in WAL mode over NFS
# or Ceph is a corruption story, not a performance one.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meal-planner-data
  namespace: meal-planner
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 2Gi
