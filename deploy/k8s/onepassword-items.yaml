# Each 1Password item becomes one Kubernetes Secret, keyed by the item's field
# labels. The operator keeps them in sync and — because of the auto-restart
# annotation — rolls the pod itself when a token is rotated in 1Password.
#
# itemPath is vaults/<vault>/items/<item>. The vault is NOT "Private": a service
# account can only be granted vaults its creator can share, and a personal vault
# is not one of those.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: kroger-credentials
  namespace: meal-planner
  annotations:
    operator.1password.io/auto-restart: "true"
spec:
  itemPath: "vaults/Homelab/items/kroger.developer"
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: slack-credentials
  namespace: meal-planner
  annotations:
    operator.1password.io/auto-restart: "true"
spec:
  itemPath: "vaults/Homelab/items/slack.mealplanner"
