# One process. Not "one for now" — one as an invariant.
#
# Two replicas would each hold their own Socket Mode connection, so Slack would
# deliver every message twice, and both would add to the same King Soopers cart.
# The Cart API only adds; it cannot read back or clear. A duplicate order is
# fixed by hand in the app or not at all.
#
# That is also why the strategy is Recreate: a RollingUpdate would run the new
# pod alongside the old one for a few seconds, which is long enough to double an
# approval and to have two processes writing one SQLite file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meal-planner
  namespace: meal-planner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: meal-planner }
  template:
    metadata:
      labels: { app: meal-planner }
    spec:
      # hostpath storage binds the volume to whichever node ran the pod first.
      # On a multi-node cluster, pin it so a reschedule cannot strand the data:
      # nodeSelector:
      #   kubernetes.io/hostname: <the node with the SSD>
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: meal-planner
          image: localhost:32000/meal-planner:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["--push"]   # post the week on start; drop this once a timer exists
          envFrom:
            - configMapRef: { name: meal-planner-config }
          # Mapped field by field rather than envFrom, so the names stay
          # readable in 1Password ("client_id") and correct in the app
          # ("KROGER_CLIENT_ID") without one of them having to give.
          env:
            - name: KROGER_CLIENT_ID
              valueFrom: { secretKeyRef: { name: kroger-credentials, key: client_id } }
            - name: KROGER_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: kroger-credentials, key: client_secret } }
            - name: SLACK_BOT_TOKEN
              valueFrom: { secretKeyRef: { name: slack-credentials, key: bot_token } }
            - name: SLACK_APP_TOKEN
              valueFrom: { secretKeyRef: { name: slack-credentials, key: app_token } }
            - name: SLACK_USER_ID
              valueFrom: { secretKeyRef: { name: slack-credentials, key: user_id } }
            - name: SLACK_ALLOWED_USERS
              valueFrom: { secretKeyRef: { name: slack-credentials, key: allowed_users } }
            - name: SLACK_CHANNEL
              valueFrom: { secretKeyRef: { name: slack-credentials, key: channel_id } }
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            # Generous ceiling: matching ~60 lines against Kroger is bursty, and
            # an OOM kill mid-approval is the one failure with real-world cost.
            limits: { cpu: "1", memory: 512Mi }
          # No probes on purpose. The agent serves no HTTP, so there is nothing
          # to GET, and a probe that only checks the process is alive would not
          # notice the thing that actually breaks — a dropped Slack socket, which
          # Bolt reconnects by itself. Add a real readiness signal when the app
          # exposes one.
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: meal-planner-data
# Deliberately no Service: Socket Mode dials out, so nothing needs to reach in.
